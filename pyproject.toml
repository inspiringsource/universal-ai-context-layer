[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools~=77.0.3"]

[dependency-groups]
dev = [
  "pytest~=9.0.2",
  "ruff~=0.15.7",
]

[project]
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "PyYAML~=6.0.1",
  "typer~=0.24.1",
]
description = "Generate a machine-readable repository context map for AI coding agents."
dynamic = [
  "version",
]
license = "MIT"
license-files = ["LICENSE"]
name = "ai-context-map"
readme = "README.md"
requires-python = ">=3.14"

[project.scripts]
aicontext = "ai_context_map.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (logic errors)
  "I",    # isort (import sorting)
  "B",    # flake8-bugbear (potential bugs)
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade (modernize syntax)
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "PTH",  # flake8-use-pathlib
  "RUF",  # Ruff-specific rules
]
ignore = [
  "E501",  # don't enforce line length as a static limit is not flexible enough
]

[tool.ruff.lint.isort]
known-first-party = ["ai_context_map"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "ai_context_map.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
