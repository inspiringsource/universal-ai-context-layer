[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools~=77.0.3"]

[project]
authors = [
  { name = "Abraham Bobrovsky" },
  { name = "Marco Benedetti" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "PyYAML~=6.0.1",
  "typer~=0.24.1",
]
description = "Context compiler for AI-assisted development: generate, validate, and refresh AGENTS.md, Markdown, and JSON context."
dynamic = [
  "version",
]
keywords = [
  "ai",
  "agents-md",
  "ai-agents",
  "ai-context",
  "context-compiler",
  "context-engineering",
  "developer-tools",
  "llm",
  "uacl",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "universal-ai-context-layer"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest~=9.0.2",
  "ruff~=0.15.7",
]

[project.scripts]
aicontext = "ai_context_map.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (logic errors)
  "I",    # isort (import sorting)
  "B",    # flake8-bugbear (potential bugs)
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade (modernize syntax)
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "PTH",  # flake8-use-pathlib
  "RUF",  # Ruff-specific rules
]
ignore = [
  "E501",  # don't enforce line length as a static limit is not flexible enough
]

[tool.ruff.lint.isort]
known-first-party = ["ai_context_map"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "ai_context_map.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
